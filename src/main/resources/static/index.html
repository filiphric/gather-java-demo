<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>Gather — Book a room</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6m1 5a5 5 0 0 1 3 5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v5m-5 0h10"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="m8 21 4-5 4 5M7 7h10m-10 4h6"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 8h12v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Zm12 1h2a3 3 0 0 1 0 6h-2M7 3v2m5-2v2"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="14" rx="3"/><path d="m15 10 6-4v12l-6-4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 10V7a2 2 0 0 1 2-2h13m-4-4 4 4-4 4M20 14v3a2 2 0 0 1-2 2H5m4-4-4 4 4 4"/></symbol>
  </svg>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Gather home"><span class="brand-mark">g</span>gather.</a>
    <span class="workspace">Bratislava <span class="demo-badge">Demo</span></span>
  </header>
  <main>
    <div class="page-heading"><h1>Book a room</h1><span class="opening-hours"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>08:00–18:00</span></div>
    <div class="toolbar">
      <div class="date-controls">
        <button class="icon-button" id="previous-day" aria-label="Previous day"><svg class="icon flipped" aria-hidden="true"><use href="#i-chevron"/></svg></button>
        <label class="date-picker"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><span class="sr-only">Booking date</span><input id="booking-date" type="date" required></label>
        <button class="icon-button" id="next-day" aria-label="Next day"><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button>
        <button class="button subtle" id="today-button">Today</button>
      </div>
      <label class="guest-picker"><svg class="icon" aria-hidden="true"><use href="#i-people"/></svg><span class="sr-only">People</span><select id="capacity-filter"><option value="1">1 person</option><option value="2" selected>2 people</option><option value="3">3 people</option><option value="4">4 people</option><option value="5">5 people</option><option value="6">6 people</option><option value="7">7 people</option><option value="8">8 people</option><option value="9">9 people</option><option value="10">10 people</option><option value="11">11 people</option><option value="12">12 people</option></select></label>
    </div>
    <p id="page-error" class="error-message" role="alert" hidden></p>
    <section id="room-list" class="room-grid" aria-label="Rooms and available times" aria-live="polite" aria-busy="true"><div class="loading">Loading rooms…</div></section>
    <section class="bookings-section" aria-labelledby="bookings-heading">
      <div class="section-heading"><h2 id="bookings-heading">Bookings <span id="booking-count" class="count">0</span></h2><span id="schedule-date"></span></div>
      <div id="booking-list" class="booking-list" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="booking-dialog" aria-labelledby="dialog-title">
    <form id="booking-form">
      <div class="dialog-heading"><div class="dialog-room"><img id="dialog-image" src="/rooms/the-nook.svg" alt=""><h2 id="dialog-title">Book a room</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Close booking form"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <input name="roomId" type="hidden">
      <label>Meeting<input name="title" value="Team meeting" required maxlength="80" autocomplete="off"></label>
      <label>Date<input name="date" type="date" required></label>
      <div class="form-row"><label>Start<input name="start" type="time" min="08:00" max="17:45" step="900" required></label><label>Duration<select name="duration"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="90">1½ hours</option><option value="120">2 hours</option></select></label></div>
      <div class="form-row organizer-row"><label>Email<input name="organizer" type="email" required maxlength="120" autocomplete="email" placeholder="you@example.com"></label><label>People<input name="attendees" type="number" min="1" max="12" value="2" required></label></div>
      <div class="repeat-options"><label class="checkbox-label"><input name="repeat" id="repeat-weekly" type="checkbox"><svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg>Repeat weekly</label><label id="occurrence-field" hidden>Meetings<input name="occurrences" type="number" min="1" max="12" value="4" disabled required></label></div>
      <p id="form-error" class="error-message" role="alert" hidden></p>
      <div class="dialog-footer"><div class="quote"><strong id="quote-total">—</strong><span id="quote-label">Total</span></div><button class="button primary submit-booking" type="submit">Book room <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
    </form>
  </dialog>
  <dialog id="cancel-dialog" aria-labelledby="cancel-title">
    <h2 id="cancel-title">Cancel booking?</h2><p id="cancel-description"></p><div class="cancel-actions"><button class="button subtle" id="keep-booking" type="button" autofocus>Keep</button><button class="button danger" id="confirm-cancel" type="button">Cancel booking</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <template id="room-template">
    <article class="room-card">
      <div class="room-visual"><img class="room-image" src="/rooms/the-nook.svg" alt=""><span class="availability"></span></div>
      <div class="room-body"><div class="room-heading"><h2></h2><span class="room-price"></span></div><div class="room-meta"><span class="room-capacity"></span><div class="amenities"></div></div><div class="time-slots" role="group" aria-label="Available one-hour start times"></div><button class="button primary room-book">Book room <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
    </article>
  </template>
</body>
</html>
